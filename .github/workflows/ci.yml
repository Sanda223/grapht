# DEV gate: every pull request (and every push to main) must build and pass
# the full test suite before it can go anywhere.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test grapht/Grapht.slnx --configuration Release --nologo
